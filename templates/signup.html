    <h1 style="color: aliceblue;">Sign Up</h1>
    <form action="/signup/" method="post">

    <div class="form-group">
        <label for="email" style="color: aliceblue;">Email</label>
        <input type="email" class="form-control" id="email" name="email" required>
    </div>
        <br>

        
    <div class="form-group">
        <label for="pass1" style="color: aliceblue;">Password</label>
        <input type="password" class="form-control p-2" id="pass1" name="pass1" required>
    </div>
        <br>

        
    <div class="form-group">
        <label for="pass2" style="color: aliceblue;">Confirm Password</label>
        <input type="password" class="form-control" id="pass2" name="pass2" required>
    </div>
        <br>

    <button type="submit" class="btn btn-primary">Sign Up</button>
        <br><br>
    <h6 style="color: aliceblue;">Already User? <a href="/">Login here</a></h6>


    </form>
    </div>
